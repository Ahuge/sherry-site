<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - Patient Advocate</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f8f9fa;
            background-image: linear-gradient(#e1e4e8 1px, transparent 1px), linear-gradient(90deg, #e1e4e8 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333;
            margin: 0; padding: 40px 20px;
        }
        .container {
            max-width: 900px; margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px; border: 2px solid #333;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
        }
        .header-zone {
            display: flex; gap: 20px; margin-bottom: 20px;
            background: repeating-linear-gradient(45deg, #f0f0f0, #f0f0f0 10px, #ffffff 10px, #ffffff 20px);
            border: 2px solid #333; padding: 15px; position: relative;
        }
        .header-zone::after {
            content: "Shaded"; position: absolute; top: 10px; right: -70px;
            color: #666; font-size: 14px;
        }
        .profile-pic {
            width: 100px; height: 120px; border: 2px dashed #333; background: #fff;
        }
        .header-text h1 { margin: 0 0 5px 0; font-size: 28px; text-transform: uppercase; }
        .header-text h2 { margin: 0; font-size: 20px; font-weight: normal; }
        
        .page-title {
            text-align: center; font-size: 24px; margin: 20px 0 30px 0; font-weight: normal;
        }
        
        .q-list { margin-bottom: 60px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .q-item {
            display: flex; align-items: center; margin-bottom: 15px; gap: 15px;
        }
        .q-circle {
            width: 40px; height: 40px; border: 2px solid #333; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px;
        }
        .q-line {
            flex: 1; height: 2px; background-color: #333; position: relative;
        }
        .q-line-long { border: 2px solid #333; height: 30px; border-left: none; border-radius: 0 15px 15px 0; }
        .q-line-short { width: 200px; }
        .etc-arrow { text-align: left; margin-left: 20px; font-size: 24px; font-weight: bold; }
        
        .footer-zone {
            display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px;
            border-top: 2px solid #333; padding-top: 20px; position: relative; margin-top: 40px;
        }
        .footer-zone::after {
            content: "PATIENT / ADVOCATE"; position: absolute; bottom: -35px; left: 50%; transform: translateX(-50%);
            font-size: 24px; letter-spacing: 2px; color: #666; white-space: nowrap;
        }
        .footer-pill {
            border: 2px solid #333; border-radius: 50px; padding: 10px 20px;
            font-size: 16px; font-weight: bold; text-align: center; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-zone">
            <div class="profile-pic"></div>
            <div class="header-text">
                <h1>NO PT LEFT BEHIND</h1>
                <h2>The Grant Innes Health Endowment Fund</h2>
            </div>
        </div>
        
        <div class="page-title">Patient Information and advocacy</div>
        
        <div class="q-list">
            <div class="q-item"><div class="q-circle">Q1</div><div class="q-line q-line-long"></div></div>
            <div class="q-item"><div class="q-circle">Q2</div><div class="q-line q-line-long"></div></div>
            <div class="q-item"><div class="q-circle">Q3</div><div class="q-line q-line-short"></div></div>
            <div class="q-item"><div class="q-circle">Q4</div><div class="q-line q-line-short"></div></div>
            <div class="q-item"><div class="q-circle">Q5</div><div class="q-line q-line-short"></div></div>
            <div class="q-item"><div class="q-circle">Q6</div><div class="q-line q-line-short"></div></div>
            <div class="q-item"><div class="q-circle" style="border:none; width:auto;">etc.</div></div>
            <div class="etc-arrow">↓</div>
        </div>
        
        <div class="footer-zone">
            <div class="footer-pill">Why NPLB</div>
            <div class="footer-pill">OUR MISSION</div>
            <div class="footer-pill">LINKS</div>
            <div class="footer-pill">CONTACT US</div>
        </div>
    </div>
</body>
</html>
